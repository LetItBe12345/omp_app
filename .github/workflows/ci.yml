name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format TODO
        run: pnpm exec prettier --check TODO/in-progress/07-files-preview-and-edit.md

      - name: Format main index
        if: always()
        run: pnpm exec prettier --check src/main/index.ts

      - name: Format workspace files
        if: always()
        run: pnpm exec prettier --check src/main/workspace-files.ts

      - name: Format preload
        if: always()
        run: pnpm exec prettier --check src/preload/index.ts

      - name: Format context drag
        if: always()
        run: pnpm exec prettier --check src/renderer/context-drag.ts

      - name: Format context references
        if: always()
        run: pnpm exec prettier --check src/renderer/context-references.tsx

      - name: Format workspace file tree
        if: always()
        run: pnpm exec prettier --check src/renderer/workspace-file-tree.tsx

      - name: Format desktop API
        if: always()
        run: pnpm exec prettier --check src/shared/desktop-api.ts

      - name: Format main tests
        if: always()
        run: pnpm exec prettier --check tests/main/workspace-files.test.ts

      - name: Format renderer setup
        if: always()
        run: pnpm exec prettier --check tests/renderer/setup.ts

      - name: Format context tests
        if: always()
        run: pnpm exec prettier --check tests/renderer/context-references.test.tsx

      - name: Format tree tests
        if: always()
        run: pnpm exec prettier --check tests/renderer/workspace-file-tree.test.tsx
