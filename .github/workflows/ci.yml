name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Apply repository formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/drag-context-references
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            src/main/workspace-files.ts \
            src/renderer/context-references.tsx \
            tests/main/workspace-files.test.ts

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/main/workspace-files.ts \
            src/renderer/context-references.tsx \
            tests/main/workspace-files.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '应用项目格式化规则'
          git push origin HEAD:agent/drag-context-references
