name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Workspace, Session, and empty new-session regression tests
        run: pnpm test:workspace-session
      - name: Test
        run: pnpm test
      - name: Fake RPC smoke
        run: OMP_RPC_FAKE=1 node scripts/rpc-smoke.mjs
      - name: Build
        run: pnpm build
      - name: Check production output
        shell: bash
        run: |
          set -euo pipefail
          if find out -type f -name '*.map' -print -quit | grep -q .; then
            echo '生产构建包含 source map' >&2
            exit 1
          fi
          if rg -n 'OMP UI fixture|tests/fixtures' out/renderer; then
            echo '生产 Renderer 包含测试 fixture' >&2
            exit 1
          fi
