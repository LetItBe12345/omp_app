name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor:
    name: Wire file tree into app shell
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/drag-context-references
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refactor app wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/renderer/app.tsx',
              "import { WorkspaceSidebar } from './workspace-sidebar'\n",
              "import { WorkspaceSidebar } from './workspace-sidebar'\nimport { WorkspaceFileTree } from './workspace-file-tree'\n",
          )
          replace_once(
              'src/renderer/app.tsx',
              "function FileTree({\n  runtime\n}: {\n  runtime: RuntimeSnapshot\n}): React.JSX.Element {\n",
              "function FileTree({\n  runtime,\n  workspaceId\n}: {\n  runtime: RuntimeSnapshot\n  workspaceId?: string\n}): React.JSX.Element {\n  if (workspaceId && !fixture) {\n    return <WorkspaceFileTree workspaceId={workspaceId} />\n  }\n",
          )
          replace_once(
              'src/renderer/app.tsx',
              '          <FileTree runtime={runtime} />',
              '          <FileTree runtime={runtime} workspaceId={activeWorkspaceId} />',
          )
          replace_once(
              'src/renderer/context-references.tsx',
              "import { WorkspaceFileTreePortal } from './workspace-file-tree'\n",
              '',
          )
          replace_once(
              'src/renderer/context-references.tsx',
              '      <WorkspaceFileTreePortal workspaceId={workspaceId} />\n',
              '',
          )
          replace_once(
              'tests/renderer/workspace-file-tree.test.tsx',
              "import { WorkspaceFileTreePortal } from '../../src/renderer/workspace-file-tree'\n",
              "import { WorkspaceFileTree } from '../../src/renderer/workspace-file-tree'\n",
          )
          replace_once(
              'tests/renderer/workspace-file-tree.test.tsx',
              '''    render(\n      <>\n        <aside data-slot="file-tree" />\n        <WorkspaceFileTreePortal workspaceId="workspace" />\n      </>\n    )\n''',
              '    render(<WorkspaceFileTree workspaceId="workspace" />)\n',
          )
          PY

      - name: Format and verify
        run: |
          pnpm exec prettier --write \
            src/renderer/app.tsx \
            src/renderer/context-references.tsx \
            src/renderer/workspace-file-tree.tsx \
            tests/renderer/workspace-file-tree.test.tsx
          pnpm check
          git diff --check

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/renderer/app.tsx \
            src/renderer/context-references.tsx \
            src/renderer/workspace-file-tree.tsx \
            tests/renderer/workspace-file-tree.test.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '直接接入应用文件栏'
          git push origin HEAD:agent/drag-context-references
