name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Stable SemVer without v, for example 0.1.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  build-candidate:
    name: Build release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.release_version }}' =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - name: Checkout requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set candidate version and prepare Runtime
        run: |
          pnpm pkg set version='${{ inputs.release_version }}'
          pnpm runtime:download
          pnpm runtime:check
      - name: Run real RPC smoke
        run: OMP_RPC_TEST_CONFIG=1 node scripts/rpc-smoke.mjs
      - name: Build candidate once and check packages
        run: |
          pnpm package:linux
          pnpm package:check
      - name: Check candidate metadata
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test "$(dpkg-deb -f "$deb" Version)" = '${{ inputs.release_version }}'
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
          test "$(dpkg-deb -f "$deb" Package)" = omp-desktop
      - name: Upload the only release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ github.sha }}-${{ inputs.release_version }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.sha256
            dist/build-metrics.json
          if-no-files-found: error
          retention-days: 30

  hosted-full-matrix:
    name: Ubuntu ${{ matrix.ubuntu }} x64 ${{ matrix.display }} candidate smoke
    needs: build-candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            ubuntu: '22.04'
            display: x11
          - runner: ubuntu-22.04
            ubuntu: '22.04'
            display: wayland
          - runner: ubuntu-24.04
            ubuntu: '24.04'
            display: x11
          - runner: ubuntu-24.04
            ubuntu: '24.04'
            display: wayland
    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .node-version
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Download the release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ github.sha }}-${{ inputs.release_version }}
          path: candidate
      - name: Verify candidate checksums
        working-directory: candidate
        run: sha256sum -c *.deb.sha256
      - name: Install candidate deb
        run: sudo apt-get update && sudo apt-get install --yes ./candidate/*.deb
      - name: Install display dependencies
        run: |
          sudo apt-get update
          if [[ '${{ matrix.display }}' == x11 ]]; then
            sudo apt-get install --yes --no-install-recommends dbus-x11 xauth xvfb
          else
            sudo apt-get install --yes --no-install-recommends dbus-x11 weston
          fi
      - name: Run candidate display smoke
        run: dbus-run-session -- bash scripts/ci-linux-display-smoke.sh '${{ matrix.display }}' '/opt/OMP Desktop/omp-desktop'
      - name: Upload display diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.ubuntu }}-${{ matrix.display }}-smoke
          path: |
            ${{ runner.temp }}/omp-ci/**
            tests/artifacts/*.png
          if-no-files-found: warn
          retention-days: 30

  gpu-acceptance:
    name: RTX 3090 Wayland candidate acceptance
    needs: [build-candidate, hosted-full-matrix]
    runs-on: [self-hosted, Linux, X64, rtx3090, wayland]
    timeout-minutes: 25
    steps:
      - name: Validate native Wayland and RTX 3090
        shell: bash
        run: |
          set -euo pipefail
          test "${XDG_SESSION_TYPE:-}" = wayland
          test -n "${WAYLAND_DISPLAY:-}"
          nvidia-smi --query-gpu=name --format=csv,noheader | tee gpu-name.txt
          grep -Eiq 'RTX 3090' gpu-name.txt
      - name: Checkout smoke and acceptance scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .node-version
      - name: Download the release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ github.sha }}-${{ inputs.release_version }}
          path: candidate
      - name: Verify candidate checksums
        working-directory: candidate
        run: sha256sum -c *.AppImage.sha256
      - name: Verify existing manual acceptance record
        shell: bash
        run: |
          set -euo pipefail
          state_root="${XDG_STATE_HOME:-${HOME}/.local/state}"
          acceptance_file="$state_root/omp-desktop/release-acceptance/${GITHUB_SHA}.json"
          node scripts/gpu-acceptance.mjs verify "$acceptance_file" \
            --commit "$GITHUB_SHA" --version '${{ inputs.release_version }}'
          mkdir -p tests/artifacts
          cp "$acceptance_file" tests/artifacts/gpu-acceptance.json
      - name: Run the candidate AppImage on real GPU
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find candidate -maxdepth 1 -name '*.AppImage' -print -quit)"
          chmod +x "$appimage"
          mkdir -p tests/artifacts
          APPIMAGE_EXTRACT_AND_RUN=1 \
          OMP_DISPLAY_SERVER=wayland \
          OMP_SMOKE_EXECUTABLE="$PWD/$appimage" \
          OMP_SMOKE_SCREENSHOT="$PWD/tests/artifacts/gpu-smoke.png" \
          OMP_GPU_ACCEPTANCE_OUTPUT="$PWD/tests/artifacts/gpu-info.json" \
            node scripts/electron-smoke.mjs
          node --input-type=commonjs - <<'NODE'
          const fs = require('node:fs')
          const data = JSON.parse(fs.readFileSync('tests/artifacts/gpu-info.json', 'utf8'))
          const status = data.featureStatus || {}
          for (const key of ['gpu_compositing', 'webgl', 'webgl2']) {
            if (!status[key] || /disabled|unavailable|software/i.test(status[key])) {
              throw new Error(`GPU feature ${key} 未通过: ${status[key]}`)
            }
          }
          NODE
      - name: Upload GPU evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpu-acceptance-${{ github.sha }}
          path: |
            tests/artifacts/*
            gpu-name.txt
          if-no-files-found: error
          retention-days: 90

  create-draft-release:
    name: Create draft release
    needs: [build-candidate, hosted-full-matrix, gpu-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the same release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ github.sha }}-${{ inputs.release_version }}
          path: dist
      - name: Download GPU evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gpu-acceptance-${{ github.sha }}
          path: gpu-evidence
      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '# OMP Desktop v${{ inputs.release_version }}' \
            '' \
            '- x64：Ubuntu 22.04/24.04，X11/Wayland Hosted smoke' \
            '- RTX 3090 原生 Wayland 真机验收' \
            '- AppImage 和 deb 从同一个 Release Candidate 构建，后续未重新打包' \
            '' \
            '请人工检查 Draft Release 的文件、SHA-256、截图和 GPU artifact，再点击 Publish。' > release-notes.md
      - name: Create or update Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v${{ inputs.release_version }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag 已存在；为避免覆盖，停止发布" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --draft --notes-file release-notes.md --target "$GITHUB_SHA"
          else
            gh release create "$tag" --draft --title "OMP Desktop $tag" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" dist/*.AppImage dist/*.deb dist/*.sha256 dist/build-metrics.json --clobber
